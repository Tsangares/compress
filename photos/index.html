<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FAF8F5">
    <title>Compress a photo — compress.applesauce.chat</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23F97316'/><text x='50' y='70' text-anchor='middle' font-size='56' font-family='monospace' fill='white'>↓</text></svg>">
    <style>
        :root {
            --bg: #FAF8F5;
            --surface: #FFFFFF;
            --text: #1A1A1A;
            --text-2: #6B6B6B;
            --text-3: #A0A0A0;
            --accent: #F97316;
            --border: rgba(0, 0, 0, 0.06);
            --good: #10B981;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111117; --surface: #1A1A22; --text: #F5F5F7;
                --text-2: #A0A0A8; --text-3: #6B6B72; --border: rgba(255,255,255,0.1);
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 18px;
            font: 14px/1.5 'Space Mono', ui-monospace, SFMono-Regular, monospace;
            background: var(--bg); color: var(--text);
            padding-bottom: max(18px, env(safe-area-inset-bottom, 0));
            padding-top: max(18px, env(safe-area-inset-top, 0));
            max-width: 640px; margin: 0 auto;
        }
        h1 { font: 700 26px/1.15 'Space Grotesk', system-ui, sans-serif; margin: 0 0 4px; }
        .lead { color: var(--text-2); margin: 0 0 20px; font-size: 13px; }
        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 14px; padding: 16px; margin-bottom: 14px;
        }
        .preview-wrap { text-align: center; }
        img.preview { max-width: 100%; max-height: 46vh; border-radius: 10px; display: none; }
        .stats { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin: 14px 0 4px; }
        .stat { text-align: center; }
        .stat .big { font: 700 22px/1.1 'Space Grotesk', system-ui, sans-serif; }
        .stat .sub { color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
        .arrow { color: var(--accent); font-size: 22px; font-weight: 700; }
        .saved { text-align: center; color: var(--good); font-weight: 700; font-size: 14px; margin-top: 6px; }
        .meta-note { text-align: center; color: var(--text-3); font-size: 11px; margin-top: 4px; }
        label.ctl { display: block; margin: 16px 0 6px; font-size: 12px; color: var(--text-2); text-transform: uppercase; letter-spacing: .05em; }
        .seg { display: flex; gap: 6px; flex-wrap: wrap; }
        .seg button {
            flex: 1 1 0; min-width: 64px; padding: 9px 6px; border-radius: 9px;
            border: 1px solid var(--border); background: var(--bg); color: var(--text);
            font: 600 13px 'Space Mono', monospace; cursor: pointer;
        }
        .seg button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        input[type=range] { width: 100%; accent-color: var(--accent); }
        .qval { color: var(--accent); font-weight: 700; }
        .actions { display: flex; gap: 10px; margin-top: 8px; }
        .btn {
            flex: 1; padding: 14px; border-radius: 11px; border: none; cursor: pointer;
            font: 700 15px 'Space Grotesk', system-ui, sans-serif;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-ghost { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
        .btn:disabled { opacity: .5; cursor: default; }
        .empty { text-align: center; padding: 30px 10px; }
        .empty p { color: var(--text-2); }
        .pick {
            display: inline-block; margin-top: 10px; padding: 13px 22px; border-radius: 11px;
            background: var(--accent); color: #fff; font: 700 15px 'Space Grotesk', sans-serif; cursor: pointer;
        }
        input[type=file] { display: none; }
        .busy { color: var(--text-2); text-align: center; padding: 20px; }
        a.home { color: var(--text-3); font-size: 12px; text-decoration: none; }
    </style>
</head>
<body>
    <h1>Compress a photo</h1>
    <p class="lead">Shrink a hi-res image to a smaller, lower-res file. 100% on your device — nothing uploaded.</p>

    <div id="empty" class="card empty">
        <p>Share a photo to Compress, or pick one:</p>
        <label class="pick">📁 Choose a photo<input id="file" type="file" accept="image/*"></label>
    </div>

    <div id="busy" class="busy" style="display:none">Loading photo…</div>

    <div id="result" style="display:none">
        <div class="card preview-wrap">
            <img id="preview" class="preview" alt="preview">
            <div class="stats">
                <div class="stat"><div class="big" id="origSize">—</div><div class="sub" id="origDim">original</div></div>
                <div class="arrow">→</div>
                <div class="stat"><div class="big" id="newSize">—</div><div class="sub" id="newDim">compressed</div></div>
            </div>
            <div class="saved" id="saved"></div>
            <div class="meta-note" id="metaNote"></div>
        </div>

        <div class="card">
            <label class="ctl">Max resolution (long edge)</label>
            <div class="seg" id="resSeg">
                <button data-edge="1280">1280</button>
                <button data-edge="1920">1080p</button>
                <button data-edge="2560" class="active">2560</button>
                <button data-edge="4096">4K</button>
                <button data-edge="0">Full</button>
            </div>
            <label class="ctl">Quality · <span class="qval" id="qval">80</span></label>
            <input type="range" id="quality" min="40" max="95" value="80" step="5">
        </div>

        <div class="actions">
            <button class="btn btn-primary" id="save">Save photo</button>
            <label class="btn btn-ghost" style="text-align:center" for="file2">New photo</label>
            <input id="file2" type="file" accept="image/*">
        </div>
        <p style="text-align:center;margin-top:14px"><a class="home" href="/">← Compress video instead</a></p>
    </div>

<script src="piexif.min.js"></script>
<script src="/shared.js"></script>
<script>
const $ = (s) => document.querySelector(s);
let sourceBitmap = null, sourceName = 'photo.jpg', originalSize = 0;
let outBlob = null, edge = 2560, quality = 0.80;
let exifObj = null;        // parsed EXIF from the original (JPEG only)
let sourceIsJpeg = false;
const fmt = CompressShared.formatBytes;

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
}

async function loadShared() {
    const id = new URLSearchParams(location.search).get('id');
    if (!id) return false;
    try {
        const resp = await fetch('/__share-probe/' + encodeURIComponent(id));
        if (!resp.ok) return false;
        const blob = await resp.blob();
        sourceName = decodeURIComponent(resp.headers.get('X-Original-Name') || 'photo.jpg');
        await loadBlob(blob);
        history.replaceState(null, '', location.pathname);
        return true;
    } catch (_) { return false; }
}

function blobToDataURL(blob) {
    return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = rej;
        r.readAsDataURL(blob);
    });
}

async function loadBlob(blob) {
    originalSize = blob.size;
    if (sourceBitmap && sourceBitmap.close) sourceBitmap.close();
    sourceBitmap = await createImageBitmap(blob);

    // Read EXIF from the original so we can carry it onto the compressed file.
    // piexifjs only handles JPEG; other formats just won't have EXIF to keep.
    exifObj = null;
    sourceIsJpeg = (blob.type === 'image/jpeg' || blob.type === 'image/jpg' || /\.jpe?g$/i.test(sourceName));
    if (sourceIsJpeg && window.piexif) {
        try { exifObj = piexif.load(await blobToDataURL(blob)); }
        catch (_) { exifObj = null; }
    }

    $('#empty').style.display = 'none';
    $('#busy').style.display = 'none';
    $('#result').style.display = 'block';
    $('#origSize').textContent = fmt(originalSize);
    $('#origDim').textContent = sourceBitmap.width + '×' + sourceBitmap.height;
    await recompress();
}

function hasExifData(obj) {
    if (!obj) return false;
    return ['0th', 'Exif', 'GPS'].some((k) => obj[k] && Object.keys(obj[k]).length > 0);
}

function dataURLtoBlob(dataUrl) {
    const [head, b64] = dataUrl.split(',');
    const mime = (head.match(/:(.*?);/) || [])[1] || 'image/jpeg';
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
}

async function recompress() {
    if (!sourceBitmap) return;
    const sw = sourceBitmap.width, sh = sourceBitmap.height;
    let tw = sw, th = sh;
    if (edge > 0 && Math.max(sw, sh) > edge) {
        const scale = edge / Math.max(sw, sh);
        tw = Math.round(sw * scale); th = Math.round(sh * scale);
    }
    const canvas = document.createElement('canvas');
    canvas.width = tw; canvas.height = th;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(sourceBitmap, 0, 0, tw, th);

    // Re-attach the original EXIF (date, GPS, camera) to the recompressed JPEG.
    // createImageBitmap already baked in display orientation, so reset the
    // Orientation tag to 1 to avoid double-rotation, and sync the dimension tags.
    let metaKept = false;
    if (exifObj && hasExifData(exifObj)) {
        try {
            const jpegDataUrl = canvas.toDataURL('image/jpeg', quality);
            exifObj['0th'][piexif.ImageIFD.Orientation] = 1;
            exifObj['0th'][piexif.ImageIFD.ImageWidth] = tw;
            exifObj['0th'][piexif.ImageIFD.ImageLength] = th;
            exifObj['Exif'][piexif.ExifIFD.PixelXDimension] = tw;
            exifObj['Exif'][piexif.ExifIFD.PixelYDimension] = th;
            const merged = piexif.insert(piexif.dump(exifObj), jpegDataUrl);
            outBlob = dataURLtoBlob(merged);
            metaKept = true;
        } catch (_) { outBlob = null; }
    }
    if (!outBlob) {
        outBlob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', quality));
    }

    $('#preview').src = URL.createObjectURL(outBlob);
    $('#preview').style.display = 'inline-block';
    $('#newSize').textContent = fmt(outBlob.size);
    $('#newDim').textContent = tw + '×' + th;
    const pct = originalSize ? Math.round((1 - outBlob.size / originalSize) * 100) : 0;
    $('#saved').textContent = pct > 0 ? `${pct}% smaller · saved ${fmt(originalSize - outBlob.size)}`
                                      : 'Already small — try lower quality';
    const hasGps = exifObj && exifObj['GPS'] && Object.keys(exifObj['GPS']).length > 0;
    $('#metaNote').textContent = metaKept
        ? `✓ metadata kept${hasGps ? ' (incl. GPS location)' : ''}`
        : (sourceIsJpeg ? '' : 'metadata not available for this format');
}

function outName() {
    const base = sourceName.replace(/\.[^.]+$/, '') || 'photo';
    return base + '-compressed.jpg';
}

// Controls
$('#resSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    [...$('#resSeg').children].forEach((x) => x.classList.remove('active'));
    b.classList.add('active');
    edge = parseInt(b.dataset.edge, 10);
    recompress();
});
$('#quality').addEventListener('input', (e) => { $('#qval').textContent = e.target.value; });
$('#quality').addEventListener('change', (e) => { quality = parseInt(e.target.value, 10) / 100; recompress(); });

$('#save').addEventListener('click', async () => {
    if (!outBlob) return;
    const file = new File([outBlob], outName(), { type: 'image/jpeg' });
    // Prefer native share (lets you save to Photos on mobile); fall back to download.
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); return; }
        catch (err) { if (err.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(outBlob); a.download = outName(); a.click();
    URL.revokeObjectURL(a.href);
    if (navigator.vibrate) navigator.vibrate(10);
});

['#file', '#file2'].forEach((sel) => $(sel).addEventListener('change', (e) => {
    const f = e.target.files[0]; if (f) loadBlob(f);
}));

(async function init() {
    if (new URLSearchParams(location.search).get('id')) {
        $('#empty').style.display = 'none';
        $('#busy').style.display = 'block';
        const ok = await loadShared();
        if (!ok) { $('#busy').style.display = 'none'; $('#empty').style.display = 'block'; }
    }
})();
</script>
</body>
</html>
